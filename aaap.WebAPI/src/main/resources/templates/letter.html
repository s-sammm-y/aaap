<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Letter For You ❤️</title>

    <!-- Journal-style fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/letter.css}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar">

    <div class="logo">
        Just For Us ❤️
    </div>

    <div class="nav-links">
        <a href="/home">Home</a>
        <a href="/memories">Memories</a>
        <a href="/gallery">Gallery</a>
        <a href="/letter" class="active">Letter</a>
    </div>

</nav>


<!-- Letter Section -->
<main class="letter-page">

    <div class="letter-card">

        <div class="paper-decoration">♥</div>

        <!-- Date -->
        <p class="date" th:text="${letter.date}">
            October 5, 2026
        </p>

        <!-- Title -->
        <h1 th:text="${letter.title}">
            To My Favourite Person ❤️
        </h1>

        <div class="letter-content">

            <!-- Greeting -->
            <p th:text="${letter.greeting}">
                My love,
            </p>

            <!-- Main Letter -->
            <p class="main-content" th:text="${letter.content}">
                Letter content goes here...
            </p>

            <!-- Closing -->
            <p class="closing" th:text="${letter.closing}">
                I love you. ❤️
            </p>

            <!-- Signature -->
            <p class="signature" th:text="${letter.signature}">
                Yours always ❤️
            </p>

        </div>

        <div class="bottom-heart">
            ♥
        </div>

    </div>

</main>

</body>
</html>
